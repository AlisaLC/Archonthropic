<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/renderer/style.css">
<style>html,body{overflow:visible;height:auto;background:#2b2840}body{padding:10px;color:#eee;font:13px sans-serif}
.stage,.chibi *{animation:none!important}.row{display:flex;gap:10px;align-items:flex-end;margin:6px}.row img{width:300px;height:300px;background:#444}
.row svg{width:300px;height:375px;background:#3a3650}</style></head>
<body><div id="g"></div><script src="../src/characters.js"></script><script>
// Reference icons live outside the repo; pass ?ref=/abs/dir. Names follow enka's UI_AvatarIcon_<Name>.png, saved as icon_<Name>.png:
//   for n in Shougun Ambor ...; do curl -so "$dir/icon_$n.png" "https://enka.network/ui/UI_AvatarIcon_$n.png"; done
const {ROSTER:R,PAIMON,drawCharacter}=Archonthropic;const ROSTER=[...R,PAIMON];const q=new URLSearchParams(location.search);
const REF={raiden:'Shougun',nahida:'Nahida',hutao:'Hutao',ganyu:'Ganyu',yae:'Yae',ayaka:'Ayaka',
  furina:'Furina',yelan:'Yelan',aino:'Aino',aloy:'Aloy',amber:'Ambor',arlecchino:'Arlecchino',
  barbara:'Barbara',beidou:'Beidou',candace:'Candace',charlotte:'Charlotte',chasca:'Chasca',
  chevreuse:'Chevreuse',chiori:'Chiori',citlali:'Citlali',clorinde:'Clorinde',collei:'Collei',
  columbina:'Columbina',dehya:'Dehya',diona:'Diona',dori:'Dori',emilie:'Emilie',escoffier:'Escoffier',
  eula:'Eula',faruzan:'Faruzan',fischl:'Fischl',iansan:'Iansan',ineffa:'Ineffa',jahoda:'Jahoda',jean:'Qin',
  kachina:'Kachina',keqing:'Keqing',kirara:'Momoka',klee:'Klee',kokomi:'Kokomi',kuki:'Shinobu',lanyan:'Lanyan',
  lauma:'Lauma',layla:'Layla',linnea:'Linnea',lisa:'Lisa',lynette:'Linette',mavuika:'Mavuika',mona:'Mona',
  mualani:'Mualani',navia:'Navia',nefer:'Nefer',nicole:'Nicole',nilou:'Nilou',ningguang:'Ningguang',
  noelle:'Noel',odette:'Odette',prune:'Prune',qiqi:'Qiqi',rosaria:'Rosaria',sandrone:'MarionetteNew',
  sara:'Sara',sayu:'Sayu',shenhe:'Shenhe',sigewinne:'Sigewinne',skirk:'SkirkNew',sucrose:'Sucrose',
  lumine:'PlayerGirl',varesa:'Varesa',vesna:'Vesna',vodyanitsa:'Vodyanitsa',xiangling:'Xiangling',
  xianyun:'Liuyun',xilonen:'Xilonen',xinyan:'Xinyan',yanfei:'Feiyan',yaoyao:'Yaoyao',yoimiya:'Yoimiya',
  mizuki:'Mizuki',yunjin:'Yunjin',zibai:'Zibai',paimon:'Paimon'};
const only=q.get('c'),st=q.get('st')||'ready',dir=q.get('ref');
for(const c of ROSTER.filter(c=>!only||only.split(',').includes(c.id)))
  document.getElementById('g').insertAdjacentHTML('beforeend',`<div class=row><img src="file://${dir}/icon_${REF[c.id]}.png">${drawCharacter(c,st)}<b>${c.name}</b></div>`);
</script></body></html>
